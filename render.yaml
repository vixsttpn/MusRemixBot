services:
  - type: web
    name: musremixbot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: VK_TOKEN
        sync: false
      - key: VK_VERSION
        value: "5.131"
      - key: YANDEX_SPEECH_KEY
        sync: false
      - key: GOOGLE_SPEECH_KEY
        sync: false
      - key: TEMP_DIR
        value: "/tmp/remix_bot"
      - key: LOG_DIR
        value: "./logs"
      - key: ASSETS_DIR
        value: "./assets"
      - key: MAX_SEARCH_RESULTS
        value: "5"
      - key: MAX_TOTAL_RESULTS
        value: "50"
      - key: VOICE_MAX_DURATION
        value: "60"
      - key: AUDIO_MAX_SIZE
        value: "52428800"
      - key: REMIX_TIMEOUT
        value: "120"
      - key: FUZZY_THRESHOLD
        value: "0.6"
      - key: SEARCH_TIMEOUT
        value: "10"
      - key: CACHE_TTL
        value: "3600"
      - key: ENABLE_CACHE
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
